[tools]
bun = "1.4.3"

[tasks.install]
description = "Install dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Check code, formatting and Markdown rules without writing"
depends = ["lint:*"]

[tasks."lint:js"]
description = "Lint TypeScript with oxlint"
run = "bunx oxlint --deny-warnings"

[tasks."lint:format"]
description = "Check formatting of Markdown, TypeScript, CSS, JSON and YAML with oxfmt"
run = "bunx oxfmt --check ."

[tasks."lint:md"]
description = "Check Markdown rules with markdownlint"
run = "bunx markdownlint-cli2 '*.md' '.github/*.md' 'docs/**/*.md'"

[tasks.fix]
description = "Apply safe lint fixes and format every file"
run = ["bunx oxlint --fix", "bunx oxfmt ."]

[tasks.build]
description = "Build the site into docs/.vitepress/dist"
run = "bunx vitepress build docs"

[tasks.check]
description = "Run every check CI runs: lint and build"
depends = ["lint", "build"]

[tasks.dev]
description = "Serve the site locally at http://localhost:5173/urls/"
run = "bunx vitepress dev docs"

[tasks."dev:lan"]
description = "Serve the site locally, visible from the network"
run = "bunx vitepress dev docs --host 0.0.0.0"

[tasks.preview]
description = "Serve the output of build"
run = "bunx vitepress preview docs"
