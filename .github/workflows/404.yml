name: URL Health Check

on:
  push:
    paths:
      - "docs/**/*.md"
      - ".github/workflows/404.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: atalent-labs/404-links@2dddde704a1633e9a55ad78d36a0149de9c89d5a # 3.1.6
        env:
          GITHUB_TOKEN: ${{ secrets.LINK_CHECK_404 }}
