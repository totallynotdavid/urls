name: URL Health Check

on:
  push:
    paths:
      - "docs/**/*.md"
      - ".github/workflows/404.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: atalent-labs/404-links@2dddde704a1633e9a55ad78d36a0149de9c89d5a # 3.1.6
        env:
          GITHUB_TOKEN: ${{ secrets.LINK_CHECK_404 }}
