name: User Experience Audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/budget.json"
      - ".github/workflows/audit-lighthouse.yml"

jobs:
  lighthouse:
    name: User Experience Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            https://totallynotdavid.github.io/urls/
            https://totallynotdavid.github.io/urls/basededatos
          budgetPath: ./.github/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
