name: User Experience Audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/budget.json"
      - ".github/workflows/audit-lighthouse.yml"

jobs:
  lighthouse:
    name: User Experience Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: treosh/lighthouse-ci-action@2e159d989f91bb9e399801b3e1ad90bcd4749f75 # v9
        with:
          urls: |
            https://totallynotdavid.github.io/urls/
            https://totallynotdavid.github.io/urls/basededatos
          budgetPath: ./.github/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
